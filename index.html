<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/style.css" />
    <title>Document</title>
  </head>
  <body>
    <h1>CSS Animation</h1>
    <hr />
    <p class="season">Season 1 (Transform)</p>
    <div class="TransformBox"><div class="Transform"></div></div>
    <hr />
    <p class="season">Season 2 (Transition)</p>
    <div class="button"></div>
    <div class="container">
      <div class="transition cubic">Cubic Bezier</div>
      <div class="transition delay">Delay</div>
      <div class="transition steps">Steps</div>
      <div class="transition steps-start">Steps-start</div>
      <div class="transition steps-end">Steps-end</div>
      <div class="transition ease">ease</div>
      <div class="transition ease-in">ease-in</div>
      <div class="transition ease-out">ease-out</div>
      <div class="transition ease-in-out">ease-in-out</div>
      <div class="transition linear">linear</div>
      <div class="transition step-start">step-start</div>
      <div class="transition step-end">step-end</div>
    </div>
    <hr>
    <p class="season">Season 3 (Keyframes Animation)</p>
    <div class="AnimationBox"></div></div>
    <hr>
    <p class="season">Season 4 (CSS 3D)</p>
    <div class="container3d">
      <div class="card3d"><div class="box3d"></div></div>
    </div>
    <hr>
  </body>
</html>

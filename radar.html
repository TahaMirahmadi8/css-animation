<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./assets/radar.css" />
        <title>Radar</title>
    </head>
    <body>
        <div class="radar-container">
            <div class="radar">
                <div class="scan-line"></div>
                <div class="scan-gradient"></div>

                <div class="border" style="--i: 1"></div>
                <div class="border" style="--i: 2"></div>
                <div class="border" style="--i: 3"></div>
                <div class="border" style="--i: 4"></div>
                <div class="border" style="--i: 5"></div>
                <div class="border" style="--i: 6"></div>

                <div class="target" style="top: 30%; left: 60%"></div>
                <div class="target" style="top: 70%; left: 40%"></div>
                <div class="target" style="top: 45%; left: 25%"></div>
                <div class="target" style="top: 92%; left: 30%"></div>
                <div class="target" style="top: 20%; left: 10%"></div>
                <div class="target" style="top: 60%; left: 95%"></div>
                <div class="target" style="top: 85%; left: 75%"></div>
            </div>
        </div>
    </body>
</html>
